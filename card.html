<template id="card-template">
    <article class="card">
        <div class="card-head">
            <button type="button" class="card-category" title="Show only this category">
                <img class="card-category-img" alt="">
                <span class="card-category-name"></span>
            </button>
            <span class="card-poc" title="Proof of Concept" hidden>
                <img src="imgs/explorer/poc-icon.png" alt="">
                PoC
            </span>
        </div>
        <div class="card-overview">
            <h3 class="card-title">
                <a class="card-title-link" target="_blank" rel="noopener noreferrer">
                    <span class="card-owner"></span><span class="card-name"></span>
                </a>
            </h3>
            <p class="card-description"></p>
            <div class="card-tags"></div>
        </div>
        <div class="card-footer">
            <div class="card_stats">
                <span class="card-stat language" hidden></span>
                <span class="card-stat stars" hidden></span>
            </div>
            <div class="card-links">
                <a class="repo-link" target="_blank" rel="noopener noreferrer">
                    <img class="repo-logo" alt="">
                    <span>code</span>
                </a>
                <a class="website-link" target="_blank" rel="noopener noreferrer" hidden>
                    <img src="imgs/explorer/homepage-icon.png" alt="">
                    <span>site</span>
                </a>
            </div>
        </div>
    </article>
</template>
