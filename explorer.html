<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X873BEV38T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-X873BEV38T');
    </script>
    <!-- end google tag -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search open source projects with a positive impact on society and the environment.">
    <meta name="theme-color" content="#4CAF50">
    <title>Tech X Good | Explorer</title>
    <link rel="icon" type="image/png" href="imgs/index/short-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Oxanium:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/explorer.css">
    <script src="js/common.js"></script>
</head>
<body>

    <!-- Navbar with the search box -->
    <header class="site-header">
        <div class="header-inner explorer-header">
            <a class="logo logo--small" href="./index.html" aria-label="techXgood home">tech<span class="logo-x">X</span>good</a>

            <form id="searchForm" class="search-box search-box--compact" role="search" action="explorer.html" method="get" autocomplete="off">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <label for="searchInput" class="sr-only">Search projects</label>
                <input id="searchInput" name="q" type="search" maxlength="100" placeholder="Search projects, keywords, languages…">
                <button id="clearSearch" class="search-clear" type="button" aria-label="Clear the search" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
                <kbd class="search-kbd" title="Press / to search">/</kbd>
                <button class="search-submit" type="submit" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </form>

            <button class="nav-toggle" type="button" aria-label="Open the menu" aria-expanded="false" aria-controls="siteNav"><span></span></button>
            <nav id="siteNav" class="site-nav" aria-label="Main">
                <a href="./index.html">Home</a>
                <a href="./explorer.html" aria-current="page">Explore</a>
                <a href="./index.html#stats">Stats</a>
                <a class="nav-cta" href="./index.html#submit-project">Submit project</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Filters -->
        <section class="toolbar" aria-label="Filters">
            <div id="categoryChips" class="category-chips" role="group" aria-label="Filter by category">
                <!-- Category chips will be inserted here dynamically -->
            </div>
            <div class="toolbar-row">
                <p id="resultsSummary" class="results-summary" aria-live="polite">Loading projects…</p>
                <div class="toolbar-controls">
                    <label class="select-pill">
                        <span class="sr-only">Order by</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>
                        <select id="orderBy"></select>
                    </label>
                    <div class="view-toggle" role="group" aria-label="View Mode">
                        <button type="button" id="btnGridView" aria-pressed="true" aria-label="Grid view" title="Grid">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
                        </button>
                        <button type="button" id="btnListView" aria-pressed="false" aria-label="List view" title="List">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="2"/><rect x="3" y="10" width="18" height="4" rx="2"/><rect x="3" y="16" width="18" height="4" rx="2"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Card grid -->
        <div class="grid" id="cardGrid" aria-busy="true">
            <!-- Cards will be inserted here dynamically -->
        </div>

        <div id="emptyState" class="empty-state" hidden>
            <span class="empty-emoji" aria-hidden="true">🌱</span>
            <h2>No projects found</h2>
            <p id="emptyText">Try other words, or one of these:</p>
            <div id="emptySuggestions" class="empty-suggestions"></div>
        </div>

        <div id="loadMore" class="load-more" hidden>
            <button class="btn btn-green" type="button">Show more projects</button>
        </div>
    </main>

    <!-- footer -->
    <footer id="footer" class="footer">
        <div class="footer-inner">
            <a class="logo" href="./index.html">tech<span class="logo-x">X</span>good</a>
            <nav class="footer-links" aria-label="Footer">
                <a href="./index.html">Home</a>
                <a href="./index.html#submit-project">Submit project</a>
                <a href="https://github.com/techXgood/techxgood/discussions">Forum</a>
                <a href="https://github.com/techxgood/techxgood">GitHub</a>
            </nav>
            <p class="footer-copy">Tech X Good © <span class="current-year"></span></p>
        </div>
    </footer>

    <button class="back-to-top" type="button" aria-label="Back to the top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
    </button>

    <script src="js/explorer.js"></script>

</body>
</html>
